<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nouveau mot de passe — Himalaya</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/jpeg" href="images/logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <main class="gate">
    <img src="images/logo.jpg" alt="Logo Himalaya" class="gate-logo">
    <h1>Choisir un nouveau mot de passe</h1>
    <p>Choisis un mot de passe d’au moins 8 caractères, puis confirme-le.</p>
    <form id="gate-form">
      <label for="reset-password">Nouveau mot de passe
        <input type="password" id="reset-password" autocomplete="new-password" minlength="8" required>
      </label>
      <label for="reset-confirm">Confirmer le nouveau mot de passe
        <input type="password" id="reset-confirm" autocomplete="new-password" minlength="8" required>
      </label>
      <button class="btn btn-primary" id="save-password" type="submit">Enregistrer le nouveau mot de passe</button>
    </form>
    <p class="form-error" id="reset-message" hidden aria-live="polite"></p>
    <a class="back-link" href="admin.html">Retour à la connexion</a>
  </main>
  <script src="assets/js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/reset-password.js"></script>
</body>
</html>
